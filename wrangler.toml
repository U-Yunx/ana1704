# Cloudflare Pages configuration for ANA24.
# Deployed via `npm run deploy` → `wrangler pages deploy dist --project-name ana24`.
name = "ana24"
pages_build_output_dir = "dist"
compatibility_date = "2024-11-01"

# Public static assets never need secrets. All privileged logic (market data,
# broker bridges, broker tokens) runs in Supabase Edge Functions that read
# their own secrets server-side.
[vars]
